version: "3.9"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dicri-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongPassword123!"
      MSSQL_PID: "Express"
    ports:
      - "11433:1433"

  api:
    build:
      context: ./dicri-backend
    container_name: dicri-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: "production"
      PORT: "3000"

      DB_SERVER: "db"               # aquí se conecta la API
      DB_DATABASE: "DICRI_Prueba"         # OJO: por ahora master para estabilizar
      DB_USER: "sa"
      DB_PASSWORD: "StrongPassword123!"
      DB_PORT: "1433"
      DB_ENCRYPT: "false"
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./dicri-frontend
    container_name: dicri-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
